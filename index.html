<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Null's Stuff (made with ai/gpt)</title>

<style>
body{
    margin:0;
    font-family:Arial,sans-serif;
    background:#111;
    color:white;
}

.sidebar{
    position:fixed;
    left:0;
    top:0;
    width:220px;
    height:100vh;
    background:#1b1b1b;
    padding-top:20px;
    box-sizing:border-box;
}

.sidebar h2{
    text-align:center;
}

.sidebar button{
    width:90%;
    margin:8px auto;
    display:block;
    padding:12px;
    border:none;
    border-radius:10px;
    background:#2d2d2d;
    color:white;
    cursor:pointer;
    font-size:16px;
}

.sidebar button:hover{
    background:#444;
}

.content{
    margin-left:240px;
    padding:25px;
}

.tab{
    display:none;
}

.tab.active{
    display:block;
}
</style>
</head>

<body>

<div class="sidebar">
    <h2>Null's Stuff</h2>

    <button onclick="showTab('games')">Games</button>
    <button onclick="showTab('projects')">Projects</button>
    <button onclick="showTab('assets')">Assets</button>
</div>

<div class="content">

    <div id="games" class="tab active">
        <h1>Games</h1>
        <p>Your games will appear here.</p>
    </div>

    <div id="projects" class="tab">
        <h1>Projects</h1>
        <p>Your Unity projects will appear here.</p>
    </div>

    <div id="assets" class="tab">
        <h1>Assets</h1>
        <p>Your assets and scripts will appear here.</p>
    </div>

</div>

<script>
function showTab(tabName){

    let tabs=document.querySelectorAll(".tab");

    tabs.forEach(tab=>{
        tab.classList.remove("active");
    });

    document.getElementById(tabName).classList.add("active");
}
</script>

</body>
</html>    <p>My first Unity project release.</p>
    <button>Download</button>
</div>

</body>
</html>
