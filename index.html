<!DOCTYPE html>
<html>
<head>

<title>Null's Stuff (V1.0)</title>

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<meta property="og:title" content="Null's Stuff">
<meta property="og:description" content="Unity projects, games, scripts, and assets.">
<meta property="og:image" content="https://nullsstuff.mooo.com/Screenshot_20260725-231354~2.png">
<meta property="og:url" content="https://nullsstuff.mooo.com">
<meta property="og:type" content="website">

<style>

* {
    box-sizing:border-box;
}

body {
    margin:0;
    background:#111;
    color:white;
    font-family:Arial, sans-serif;
    overflow-x:hidden;
}


.version {
    text-align:center;
    color:#aaa;
    margin-top:-10px;
    font-size:14px;
}


/* Sidebar */

.sidebar {
    position:fixed;
    left:0;
    top:0;

    width:240px;
    height:100vh;

    background:#1b1b1b;

    padding-top:60px;

    transition:transform 0.4s ease-in-out;

    z-index:10;
}


.sidebar.closed {
    transform:translateX(-240px);
}


.sidebar h2 {
    text-align:center;
}


.sidebar button {

    width:90%;

    margin:10px auto;

    display:block;

    padding:12px;

    border:none;

    border-radius:12px;

    background:#292929;

    color:white;

    cursor:pointer;

    font-size:16px;

}


.sidebar button:hover {

    background:#444;

}


/* Close button */

.closeBtn {

    position:absolute;

    right:15px;

    top:15px;


    width:40px;

    height:40px;


    border:none;

    border-radius:10px;


    background:#292929;

    color:white;


    font-size:20px;

    cursor:pointer;

}


.closeBtn:hover {

    background:#444;

}


/* Open button */

.toggle {

    position:fixed;

    left:15px;

    top:20px;


    background:#292929;

    color:white;


    border:none;

    border-radius:10px;


    padding:10px;


    font-size:20px;


    cursor:pointer;


    z-index:20;


    transition:0.4s;

}


.toggle.hidden {

    opacity:0;

    pointer-events:none;

}



/* Content */

.content {

    margin-left:240px;

    padding:30px;


    transition:

    margin-left 0.4s ease-in-out,

    transform 0.35s ease,

    opacity 0.35s ease;

}


.content.full {

    margin-left:0;

}


.content.animate {

    transform:translateX(-60px);

    opacity:0;

}


/* Tabs */

.tab {

    display:none;

}


.tab.active {

    display:block;

    animation:enter 0.35s ease;

}



@keyframes enter {

    from {

        transform:translateX(60px);

        opacity:0;

    }


    to {

        transform:translateX(0);

        opacity:1;

    }

}



/* Files */

.file {

    display:flex;

    align-items:center;

    justify-content:space-between;


    background:#1b1b1b;


    border-radius:12px;


    padding:15px;


    margin-top:15px;


    width:100%;

    max-width:900px;

}


.fileInfo {

    display:flex;

    flex-direction:column;

}


.fileName {

    font-size:17px;

    font-weight:bold;

}


.fileSize {

    color:#aaa;

    margin-top:4px;

}



.downloadBtn {

    width:45px;

    height:45px;


    display:flex;

    align-items:center;

    justify-content:center;


    background:#292929;


    color:white;


    border-radius:10px;


    text-decoration:none;


    font-size:25px;

}


.downloadBtn:hover {

    background:#444;

}


</style>

</head>


<body>


<button class="toggle hidden" id="toggle" onclick="toggleSidebar()">
☰
</button>



<div class="sidebar" id="sidebar">


<button class="closeBtn" onclick="toggleSidebar()">
✕
</button>


<h2>Null's Stuff</h2>

<p class="version">
V1.0
</p>


<button onclick="switchTab('games')">
Games
</button>


<button onclick="switchTab('projects')">
Projects
</button>


<button onclick="switchTab('assets')">
Assets
</button>


</div>




<div class="content" id="content">


<div id="games" class="tab active">

<h1>Games</h1>

<div id="gameFiles"><p>Loading games...</p></div>

</div>




<div id="projects" class="tab">

<h1>Projects</h1>

<div id="projectFiles"><p>Loading projects...</p></div>

</div>




<div id="assets" class="tab">

<h1>Assets</h1>


<div id="assetFiles">

<p>Loading files...</p>

</div>


</div>


</div>
<script type="module">

import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";

import { 
    getFirestore,
    collection,
    getDocs
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";



const firebaseConfig = {

    apiKey: "AIzaSyB85-ZUtlP8pY7r67VZZ6ig1HJ16djYVKA",

    authDomain: "nulls-stuff-official.firebaseapp.com",

    projectId: "nulls-stuff-official",

    storageBucket: "nulls-stuff-official.firebasestorage.app",

    messagingSenderId: "12929244122",

    appId: "1:12929244122:web:cf288da601a9f29282fee3"

};



const app = initializeApp(firebaseConfig);

const db = getFirestore(app);





// Load files from Firestore

async function loadFiles(){

    const gameContainer=document.getElementById("gameFiles");
    const projectContainer=document.getElementById("projectFiles");
    const assetContainer=document.getElementById("assetFiles");

    gameContainer.innerHTML="";
    projectContainer.innerHTML="";
    assetContainer.innerHTML="";

    const snapshot=await getDocs(collection(db,"downloads"));

    snapshot.forEach((doc)=>{
        const file=doc.data();
        let container=null;

        if(file.category==="games") container=gameContainer;
        else if(file.category==="projects") container=projectContainer;
        else if(file.category==="assets") container=assetContainer;

        if(!container) return;

        container.innerHTML+=`
        <div class="file">
            <div class="fileInfo">
                <div class="fileName">${file.name}</div>
                <div class="fileSize">${file.size}</div>
            </div>
            <a class="downloadBtn" href="${file.download}" target="_blank">↓</a>
        </div>`;
    });

}

loadFiles();



</script>





<script>


const sidebar =
document.getElementById("sidebar");


const toggle =
document.getElementById("toggle");


const content =
document.getElementById("content");





function toggleSidebar(){


    sidebar.classList.toggle("closed");


    content.classList.toggle("full");



    if(sidebar.classList.contains("closed")){


        toggle.classList.remove("hidden");


    }

    else {


        toggle.classList.add("hidden");


    }


}





function switchTab(name){


    content.classList.add("animate");



    setTimeout(()=>{


        document.querySelectorAll(".tab")
        .forEach(tab=>{


            tab.classList.remove("active");


        });



        document.getElementById(name)
        .classList.add("active");



        content.classList.remove("animate");



    },350);



}



</script>



</body>

</html>
