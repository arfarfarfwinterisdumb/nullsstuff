<!DOCTYPE html>
<html>
<head>

<title>Null's Stuff (V1.1)</title>

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<meta property="og:title" content="Null's Stuff">
<meta property="og:description" content="Unity projects, games, scripts, and assets.">
<meta property="og:image" content="https://nullsstuff.mooo.com/Screenshot_20260725-231354~2.png">
<meta property="og:url" content="https://nullsstuff.mooo.com">
<meta property="og:type" content="website">

<meta property="og:image:width" content="720">
<meta property="og:image:height" content="289">

<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="Null's Stuff">
<meta name="twitter:description" content="Unity projects, games, scripts, and assets.">
<meta name="twitter:image" content="https://nullsstuff.mooo.com/Screenshot_20260725-231354~2.png">


<style>

* {
    box-sizing:border-box;
}


body {
    margin:0;
    background:#111;
    color:white;
    font-family:Arial, sans-serif;
    overflow-x:hidden;
}



/* Sidebar */

.sidebar {

    position:fixed;
    left:0;
    top:0;

    width:240px;
    height:100vh;

    background:#1b1b1b;

    padding-top:60px;

    transition:transform 0.4s ease-in-out;

    z-index:10;
}


.sidebar.closed {
    transform:translateX(-240px);
}


.sidebar h2 {
    text-align:center;
}


.sidebar button {

    width:85%;

    margin:10px auto;

    display:block;

    padding:12px;


    border:none;

    border-radius:12px;


    background:#292929;

    color:white;


    cursor:pointer;

    font-size:16px;


    transition:0.2s;

}


.sidebar button:hover {
    background:#444;
}



/* Close */

.closeBtn {

    position:absolute;

    right:15px;

    top:15px;


    width:40px;

    height:40px;


    border:none;

    border-radius:10px;


    background:#292929;

    color:white;


    font-size:20px;

    cursor:pointer;

}


.closeBtn:hover {
    background:#444;
}



/* Open button */

.toggle {

    position:fixed;

    left:15px;

    top:20px;


    background:#292929;

    color:white;


    border:none;

    border-radius:10px;


    padding:10px;


    font-size:20px;


    cursor:pointer;


    z-index:20;


    opacity:1;


    transition:0.4s ease-in-out;

}


.toggle.hidden {

    opacity:0;

    pointer-events:none;

}




/* Content */

.content {

    margin-left:240px;

    padding:30px;


    transition:

    transform 0.35s ease,

    opacity 0.35s ease;

}



.content.animate {

    transform:translateX(-60px);

    opacity:0;

}



/* Tabs */

.tab {

    display:none;

}


.tab.active {

    display:block;

    animation:enter 0.35s ease;

}



@keyframes enter {

    from {

        transform:translateX(60px);

        opacity:0;

    }


    to {

        transform:translateX(0);

        opacity:1;

    }

}




/* Files */

.file {

    display:flex;

    align-items:center;

    justify-content:space-between;


    background:#1b1b1b;


    border-radius:12px;


    padding:15px;


    margin-top:15px;


    max-width:600px;

}



.fileInfo {

    display:flex;

    flex-direction:column;

}



.fileName {

    font-size:17px;

    font-weight:bold;

}



.fileSize {

    color:#aaa;

    font-size:14px;

    margin-top:4px;

}



.downloadBtn {

    width:40px;

    height:40px;


    display:flex;

    align-items:center;

    justify-content:center;


    background:#292929;


    color:white;


    border-radius:10px;


    text-decoration:none;


    font-size:24px;


    transition:0.2s;

}



.downloadBtn:hover {

    background:#444;

}


</style>

</head>



<body>



<div class="sidebar" id="sidebar">


<button class="closeBtn" onclick="toggleSidebar()">
✕
</button>


<h2>Null's Stuff</h2>


<button onclick="switchTab('games')">
Games
</button>


<button onclick="switchTab('projects')">
Projects
</button>


<button onclick="switchTab('assets')">
Assets
</button>


</div>




<button class="toggle hidden" id="toggle" onclick="toggleSidebar()">
☰
</button>





<div class="content" id="content">


<div id="games" class="tab active">

<h1>Games</h1>

<p>My games will appear here.</p>

</div>




<div id="projects" class="tab">

<h1>Projects</h1>

<p>My Unity projects will appear here.</p>

</div>




<div id="assets" class="tab">

<h1>Assets</h1>


<div class="file">

<div class="fileInfo">

<div class="fileName">
every_update.dlc (gorilla tag)
</div>


<div class="fileSize">
501KB
</div>


</div>



<a class="downloadBtn" href="https://drive.google.com/uc?export=download&id=15myLewAj-xG4phZZ_hKVqk0XcWG48-4q">
↓
</a>


</div>


</div>


</div>






<script>


const sidebar = document.getElementById("sidebar");

const toggle = document.getElementById("toggle");

const content = document.getElementById("content");



function toggleSidebar(){


sidebar.classList.toggle("closed");


if(sidebar.classList.contains("closed")){

toggle.classList.remove("hidden");

}

else {

toggle.classList.add("hidden");

}


}




function switchTab(name){


content.classList.add("animate");


setTimeout(()=>{


document.querySelectorAll(".tab")
.forEach(tab=>{

tab.classList.remove("active");

});


document.getElementById(name)
.classList.add("active");


content.classList.remove("animate");


},350);


}


</script>



</body>
</html>
